name: Release

# Tag push (v*)       -> build everything and publish a GitHub Release.
# workflow_dispatch   -> build only; artifacts are uploaded to the run, no release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_FLAGS: -trimpath

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-manual.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # Tests that need adb, swiftc, lldb or a device skip themselves when the tool/env is missing.
      - run: go vet ./...
      - run: go test ./...

  app:
    name: macOS app (${{ matrix.arch }})
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            optional: false
          - arch: amd64
            runner: macos-15-intel
            optional: true # best effort: a failure here does not block the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Signing needs the Developer ID certificate secrets. Notarization additionally needs either an
      # App Store Connect API key (preferred) or an Apple ID + app-specific password. Otherwise: ad-hoc.
      HAVE_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAVE_ASC_KEY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
      HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && ((secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '') || (secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/pf-build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PW"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | grep "$APPLE_TEAM_ID" | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity for team $APPLE_TEAM_ID in the certificate"; exit 1; }
          echo "PL_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "PL_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build Pocketlab.app and .dmg
        env:
          PL_VERSION: ${{ env.VERSION }}
        run: scripts/build-desktop.sh --dmg

      - name: Notarize and staple
        if: env.HAVE_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$HAVE_ASC_KEY" = "true" ]; then
            echo "Notarizing with App Store Connect API key"
            KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
            (umask 077; echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE")
            trap 'rm -f "$KEY_FILE"' EXIT
            xcrun notarytool submit dist/Pocketlab.dmg \
              --key "$KEY_FILE" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          else
            echo "Notarizing with Apple ID + app-specific password"
            xcrun notarytool submit dist/Pocketlab.dmg \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          fi
          xcrun stapler staple dist/Pocketlab.dmg
          # The notarization ticket covers the app inside the dmg, so staple the loose app as well.
          xcrun stapler staple dist/Pocketlab.app
          spctl --assess --type execute --verbose=2 dist/Pocketlab.app

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/Pocketlab.dmg "out/Pocketlab-${VERSION}-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --keepParent dist/Pocketlab.app "out/Pocketlab-${VERSION}-macos-${{ matrix.arch }}.zip"
          ls -lh out

      - name: Clean up keychain
        if: always() && env.HAVE_SIGNING == 'true'
        run: security delete-keychain "$PL_KEYCHAIN" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  cli:
    name: CLI + server (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        run: |
          set -euo pipefail
          NAME="pocketlab_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "pkg/$NAME" out
          LDFLAGS="-s -w -X pocketlab/internal/version.Version=${VERSION}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build $GO_FLAGS -ldflags "$LDFLAGS" -o "pkg/$NAME/pocketlabd$EXT" ./cmd/pocketlabd
          go build $GO_FLAGS -ldflags "$LDFLAGS" -o "pkg/$NAME/pocketlab$EXT" ./cmd/pocketlab
          if [ "$GOOS" = "darwin" ]; then
            # Pinned WebDriverAgent source: "Build WDA" extracts it on the user's Mac (no git or network).
            WDA_TARBALL=$(scripts/fetch-wda.sh)
            cp "$WDA_TARBALL" "pkg/$NAME/"
            WDA_LICENSE=$(tar -tzf "$WDA_TARBALL" | awk '/^[^\/]+\/LICENSE$/ && !f {print; f=1}')
            [ -n "$WDA_LICENSE" ] || { echo "error: no top-level LICENSE found in $WDA_TARBALL" >&2; exit 1; }
            tar -xzOf "$WDA_TARBALL" "$WDA_LICENSE" > "pkg/$NAME/WebDriverAgent-LICENSE.txt"
          fi
          cat > "pkg/$NAME/README.txt" <<README
          Pocketlab ${VERSION} (${GOOS}/${GOARCH})

            pocketlabd  headless server: REST /api/v1, MCP /mcp and the web UI on 127.0.0.1:8700
            pocketlab   command-line client for a running server

          Quick start:
            ./pocketlabd &            # needs adb in PATH for Android devices
            ./pocketlab devices
            ./pocketlab version

          macOS + iPhone: keep WebDriverAgent-*.tar.gz next to pocketlabd (it is the pinned appium/WebDriverAgent
          source, BSD licence). Needs Xcode; run ./pocketlab ios build-wda or use "Build WDA" in the web UI.

          Docs: https://github.com/hakanngul/phoneforge
          README
          if [ "$GOOS" = "windows" ]; then
            (cd pkg && zip -qr "../out/$NAME.zip" "$NAME")
          else
            tar -C pkg -czf "out/$NAME.tar.gz" "$NAME"
          fi
          ls -lh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  app-windows:
    name: Windows app (amd64)
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true # best effort (unsigned, untested on device): a failure does not block the release
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p pkg out
          LDFLAGS="-s -w -H windowsgui -X pocketlab/internal/version.Version=${VERSION}"
          go build $GO_FLAGS -ldflags "$LDFLAGS" -o pkg/pocketlab-desktop.exe ./cmd/pocketlab-desktop
          (cd pkg && 7z a -tzip "../out/Pocketlab-${VERSION}-windows-amd64.zip" pocketlab-desktop.exe)
          ls -lh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows-amd64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [version, app, cli, app-windows]
    # app may be "success" even when the optional amd64 build failed (continue-on-error).
    if: ${{ !cancelled() && needs.app.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAVE_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && ((secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '') || (secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '')) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload bundle (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: artifacts/*
      - name: Release notes header
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo '- **macOS app:** download `Pocketlab-<version>-macos-<arch>.dmg` (or the `.zip`) and drag `Pocketlab.app` to Applications.'
            echo '- **CLI + server:** download `pocketlab_<version>_<os>_<arch>.tar.gz` (`.zip` on Windows), extract, and run `./pocketlabd` / `./pocketlab` (`pocketlabd.exe` / `pocketlab.exe` on Windows).'
            echo '- **Windows app (experimental, unsigned):** `Pocketlab-<version>-windows-amd64.zip`; needs the WebView2 runtime.'
            echo '- Verify downloads with `SHA256SUMS.txt`.'
            echo
            if [ "$HAVE_NOTARY" = "true" ]; then
              echo '> **Signing:** the macOS app is signed with a Developer ID certificate, **notarized by Apple** and stapled; it opens without Gatekeeper warnings.'
            elif [ "$HAVE_SIGNING" = "true" ]; then
              echo '> **Signing:** the macOS app is signed with a Developer ID certificate but **not notarized**.'
              echo '> On first open, right-click the app and choose **Open**, or run'
              echo '> `xattr -dr com.apple.quarantine /Applications/Pocketlab.app`.'
            else
              echo '> **Signing:** the macOS app is **ad-hoc signed and not notarized**.'
              echo '> On first open, right-click the app and choose **Open**, or run'
              echo '> `xattr -dr com.apple.quarantine /Applications/Pocketlab.app`.'
            fi
            echo
            echo "## Changes"
          } > release-body.md
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*
